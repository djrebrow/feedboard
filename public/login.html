<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feedboard — Anmelden</title>
  <meta name="theme-color" content="#fffdf8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1e1a15" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='18' fill='%23b3341e'/%3E%3Ctext x='50' y='72' font-size='62' text-anchor='middle' fill='%23fffdf9' font-family='Georgia,serif' font-weight='bold'%3EF%3C/text%3E%3C/svg%3E">
  <!-- Bewusst ohne externe Schriften und ohne style.css: die Login-Seite muss
       auch dann laden, wenn alles andere hinter der Anmeldung liegt. -->
  <style>
    :root {
      --bg: #f6f2ea; --surface: #fffdf8; --ink: #1c1914; --muted: #71695b;
      --line: #e4ddce; --accent: #b3341e; --accent-ink: #fffdf8; --danger: #b3341e;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #15120e; --surface: #1e1a15; --ink: #ede7da; --muted: #9b917f;
        --line: #302a21; --accent: #e25638; --accent-ink: #1a0e0a; --danger: #e25638;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: var(--bg);
      background-image: radial-gradient(rgba(120, 100, 70, 0.05) 1px, transparent 1px);
      background-size: 26px 26px;
      color: var(--ink); font-family: 'Segoe UI', Arial, sans-serif; padding: 24px;
    }
    .card {
      width: 100%; max-width: 360px; background: var(--surface);
      border: 1px solid var(--line); border-radius: 14px; padding: 28px 26px 24px;
      box-shadow: 0 1px 2px rgba(38, 30, 18, 0.05), 0 8px 28px -14px rgba(38, 30, 18, 0.22);
    }
    h1 {
      margin: 0 0 4px; font-family: Georgia, 'Times New Roman', serif;
      font-size: 28px; letter-spacing: -0.01em;
    }
    p.hint { margin: 0 0 20px; color: var(--muted); font-size: 13.5px; }
    label { display: block; font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin-bottom: 6px; }
    input {
      width: 100%; padding: 10px 12px; font-size: 15px; font-family: inherit;
      color: var(--ink); background: var(--bg); border: 1px solid var(--line);
      border-radius: 8px; outline: none;
    }
    input:focus { border-color: var(--accent); }
    button {
      width: 100%; margin-top: 16px; padding: 11px 12px; font-size: 15px; font-family: inherit;
      font-weight: 600; color: var(--accent-ink); background: var(--accent);
      border: none; border-radius: 8px; cursor: pointer;
    }
    button:disabled { opacity: 0.6; cursor: default; }
    .error { margin-top: 14px; color: var(--danger); font-size: 13.5px; min-height: 1.2em; }
  </style>
</head>
<body>
  <form class="card" id="form-login" autocomplete="on">
    <h1>Feedboard</h1>
    <p class="hint">Bitte Passwort eingeben.</p>
    <label for="password">Passwort</label>
    <input type="password" id="password" name="password" autocomplete="current-password" autofocus required>
    <button type="submit" id="submit">Anmelden</button>
    <div class="error" id="error" role="alert"></div>
  </form>

  <script>
    const form = document.getElementById('form-login');
    const input = document.getElementById('password');
    const button = document.getElementById('submit');
    const errorEl = document.getElementById('error');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      errorEl.textContent = '';
      button.disabled = true;
      try {
        const response = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: input.value }),
        });
        const data = await response.json().catch(() => null);
        if (!response.ok) throw new Error((data && data.error) || 'Anmeldung fehlgeschlagen.');
        location.replace('/');
      } catch (error) {
        errorEl.textContent = error.message;
        input.select();
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
