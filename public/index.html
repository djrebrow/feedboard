<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feedboard</title>
  <!-- Farbe der Browser-/System-Leiste = Masthead-Hintergrund (--surface); app.js koppelt sie an die Design-Auswahl -->
  <meta name="theme-color" content="#fffdf8" media="(prefers-color-scheme: light)" data-theme-color="light">
  <meta name="theme-color" content="#1e1a15" media="(prefers-color-scheme: dark)" data-theme-color="dark">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Libre+Franklin:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='18' fill='%23b3341e'/%3E%3Ctext x='50' y='72' font-size='62' text-anchor='middle' fill='%23fffdf9' font-family='Georgia,serif' font-weight='bold'%3EF%3C/text%3E%3C/svg%3E">
  <link rel="apple-touch-icon" href="icon.svg">
</head>
<body>

  <header class="masthead">
    <div class="masthead-inner">
      <div class="masthead-top">
        <span id="today-date" class="masthead-date"></span>
        <span class="masthead-status"><span data-i18n="status_label">Stand:</span> <span id="last-updated">–</span></span>
      </div>
      <div class="masthead-main">
        <h1 class="masthead-title">Feedboard</h1>
        <div class="toolbar">
          <div class="search-box">
            <svg class="icon search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
            <input type="search" id="input-search" placeholder="Suchen …" data-i18n-placeholder="search_placeholder" autocomplete="off">
            <button id="btn-search-clear" class="search-clear" type="button" title="Suche leeren" hidden>✕</button>
          </div>
          <button id="btn-unread" class="tool-btn tool-btn-icon" title="Nur Ungelesene anzeigen" data-i18n-title="unread_only_title" aria-pressed="false">
            <svg class="icon icon-unread-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="icon icon-unread-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/><line x1="3" y1="3" x2="21" y2="21"/></svg>
          </button>
          <button id="btn-saved" class="tool-btn tool-btn-icon" title="Gespeicherte Artikel" data-i18n-title="saved_title" aria-pressed="false">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
          </button>
          <button id="btn-refresh" class="tool-btn" title="Alle Feeds jetzt aktualisieren" data-i18n-title="refresh_title">
            <svg class="icon icon-refresh" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><polyline points="21 3 21 9 15 9"/></svg>
            <span class="tool-label" data-i18n="refresh_label">Aktualisieren</span>
          </button>
          <div class="settings" id="settings">
            <button id="btn-settings" class="tool-btn tool-btn-icon" title="Einstellungen" data-i18n-title="settings_title" aria-expanded="false" aria-haspopup="true">
              <svg class="icon icon-gear" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
            </button>
            <div class="settings-menu" id="settings-menu" hidden>
              <div class="settings-actions">
                <button id="btn-lang" class="round-btn round-btn-lang" type="button" title="Sprache wechseln" data-i18n-title="lang_switch_title"><span class="lang-label">DE</span></button>
                <button id="btn-edit" class="round-btn" type="button" title="Rubriken und Feeds verwalten" data-i18n-title="edit_title">
                  <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
                </button>
                <button id="btn-theme" class="round-btn" type="button" title="Design wechseln (hell/dunkel)" data-i18n-title="theme_title">
                  <svg class="icon icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
                  <svg class="icon icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
                </button>
              </div>

              <div class="settings-row">
                <span class="settings-label" data-i18n="theme_label">Design</span>
                <div class="seg" id="seg-theme">
                  <button type="button" data-theme-pref="light" class="seg-btn" data-i18n="theme_light">Hell</button>
                  <button type="button" data-theme-pref="dark" class="seg-btn" data-i18n="theme_dark">Dunkel</button>
                  <button type="button" data-theme-pref="system" class="seg-btn" data-i18n="theme_system">System</button>
                </div>
              </div>

              <div class="settings-row">
                <span class="settings-label" data-i18n="font_size_label">Schriftgröße</span>
                <div class="seg" id="seg-fontsize">
                  <button type="button" data-fontsize="small" class="seg-btn seg-font-s">A</button>
                  <button type="button" data-fontsize="normal" class="seg-btn seg-font-m">A</button>
                  <button type="button" data-fontsize="large" class="seg-btn seg-font-l">A</button>
                </div>
              </div>

              <div class="settings-row">
                <span class="settings-label" data-i18n="density_label">Dichte</span>
                <div class="seg" id="seg-density">
                  <button type="button" data-density="comfortable" class="seg-btn" data-i18n="density_comfortable">Komfortabel</button>
                  <button type="button" data-density="compact" class="seg-btn" data-i18n="density_compact">Kompakt</button>
                </div>
              </div>

              <label class="settings-toggle">
                <input type="checkbox" id="chk-thumbnails">
                <span data-i18n="thumbnails_label">Thumbnails in der Liste</span>
              </label>
              <label class="settings-toggle">
                <input type="checkbox" id="chk-favicon-cache">
                <span data-i18n="favicon_cache_label">Favicons lokal cachen</span>
              </label>

              <div class="settings-section">
                <span class="settings-label" data-i18n="mute_label">Ausblenden (ein Wort pro Zeile)</span>
                <textarea id="input-mute" class="settings-textarea" rows="3" spellcheck="false" placeholder="…" data-i18n-placeholder="mute_placeholder"></textarea>
                <button id="btn-mute-save" class="btn btn-accent settings-save" type="button" data-i18n="save">Speichern</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </header>

  <div id="edit-bar" class="edit-bar hidden">
    <div class="edit-bar-inner">
      <span class="edit-bar-hint" data-i18n="edit_hint_categories">Bearbeitungsmodus — Rubriken anlegen, umbenennen, sortieren und löschen.</span>
      <form id="form-add-category" class="inline-form">
        <input type="text" id="input-category-name" placeholder="Neue Rubrik …" data-i18n-placeholder="new_category_placeholder" maxlength="80" autocomplete="off">
        <span class="slug-field">
          <span class="slug-affix">#/</span>
          <input type="text" id="input-category-slug" placeholder="anker" data-i18n-placeholder="anchor_placeholder" maxlength="80" autocomplete="off" spellcheck="false">
        </span>
        <button type="submit" class="btn btn-accent" data-i18n="create_category">Rubrik anlegen</button>
      </form>
    </div>
  </div>

  <main id="board" class="board" aria-live="polite"></main>

  <input type="file" id="logo-file-input" accept="image/*" hidden>

  <div id="article-preview" class="article-preview" hidden aria-hidden="true"></div>

  <div id="preview-sheet" class="preview-sheet" hidden aria-hidden="true">
    <div class="preview-sheet-backdrop" data-action="sheet-close"></div>
    <div class="preview-sheet-card" role="dialog" aria-modal="true"></div>
  </div>

  <div id="toast-container" class="toast-container" aria-live="assertive"></div>

  <script src="app.js"></script>
</body>
</html>
